<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Печальная пони — сообщество</title>
    <meta name="description" content="Сообщество «Печальная пони» — место, где грустить вместе не так одиноко.">

    <!-- Иконка сайта (favicon) -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(160deg, #2b2436 0%, #4a3f5c 50%, #6b5b7d 100%);
            color: #e8e4f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 50px 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        /* === АНИМАЦИЯ: каждая пони по 3 секунды === */
        .pony-animation {
            width: 180px;
            height: 180px;
            margin: 0 auto 20px;
            position: relative;
            animation: sway 4s ease-in-out infinite;
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.4));
        }

        .pony-animation img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            animation: fadeCycle 18s infinite;
        }

        /* 6 картинок × 3 секунды = 18 секунд полный цикл */
        .pony-animation img:nth-child(1) { animation-delay: 0s; }
        .pony-animation img:nth-child(2) { animation-delay: 3s; }
        .pony-animation img:nth-child(3) { animation-delay: 6s; }
        .pony-animation img:nth-child(4) { animation-delay: 9s; }
        .pony-animation img:nth-child(5) { animation-delay: 12s; }
        .pony-animation img:nth-child(6) { animation-delay: 15s; }

        /* Плавное появление и исчезновение */
        @keyframes fadeCycle {
            0%   { opacity: 0; }
            5%   { opacity: 1; }
            14%  { opacity: 1; }
            19%  { opacity: 0; }
            100% { opacity: 0; }
        }

        /* Покачивание всей группы */
        @keyframes sway {
            0%, 100% { transform: rotate(-3deg); }
            50%      { transform: rotate(3deg); }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #c9b8e8, #9d8ec4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            font-size: 1.1rem;
            color: #b8aed0;
            margin-bottom: 40px;
            line-height: 1.6;
            font-style: italic;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 30px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            color: #e8e4f0;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .link-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(201, 184, 232, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .link-btn .icon {
            font-size: 1.3rem;
        }

        .footer {
            font-size: 0.85rem;
            color: #8a7fa8;
            margin-top: 30px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.9rem; }
            .pony-animation { width: 140px; height: 140px; }
            .container { padding: 35px 20px; }
            .tagline { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- Анимированная пони -->
        <div class="pony-animation">
            <img src="pony1.png" alt="Печальная пони">
            <img src="pony2.png" alt="Печальная пони">
            <img src="pony3.png" alt="Печальная пони">
            <img src="pony4.png" alt="Печальная пони">
            <img src="pony5.png" alt="Печальная пони">
            <img src="pony6.png" alt="Печальная пони">
        </div>

        <h1>Печальная пони</h1>
        <p class="tagline">Грустить вместе — не так одиноко.<br>Уютное сообщество для тех, кто устал.</p>

        <div class="links">
            <a href="https://t.me/ВАШ_КАНАЛ" class="link-btn" target="_blank" rel="noopener">
                <span class="icon">✈️</span>
                <span>Telegram</span>
            </a>
            <a href="https://discord.gg/ВАШ_СЕРВЕР" class="link-btn" target="_blank" rel="noopener">
                <span class="icon">💬</span>
                <span>Discord</span>
            </a>
            <a href="https://tiktok.com/@ВАШ_АККАУНТ" class="link-btn" target="_blank" rel="noopener">
                <span class="icon">🎵</span>
                <span>TikTok</span>
            </a>
        </div>

        <p class="footer">
            © 2026 Сообщество «Печальная пони»<br>
            Сделано с грустью и любовью
        </p>
    </div>
</body>
</html>
