<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Печальная пони — сообщество</title>
    <meta name="description" content="Сообщество «Печальная пони» — место, где грустить вместе не так одиноко.">

    <!-- Иконка сайта (favicon) -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(160deg, #2b2436 0%, #4a3f5c 50%, #6b5b7d 100%);
            color: #e8e4f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 50px 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        /* === АНИМАЦИЯ: каждая пони по 3 секунды === */
        .pony-animation {
            width: 180px;
            height: 180px;
            margin: 0 auto 20px;
            position: relative;
            animation: sway 4s ease-in-out infinite;
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.4));
        }

        .pony-animation img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            animation: fadeCycle 18s infinite;
        }

        .pony-animation img:nth-child(1) { animation-delay: 0s; }
        .pony-animation img:nth-child(2) { animation-delay: 3s; }
        .pony-animation img:nth-child(3) { animation-delay: 6s; }
        .pony-animation img:nth-child(4) { animation-delay: 9s; }
        .pony-animation img:nth-child(5) { animation-delay: 12s; }
        .pony-animation img:nth-child(6) { animation-delay: 15s; }

        @keyframes fadeCycle {
            0%   { opacity: 0; }
            5%   { opacity: 1; }
            14%  { opacity: 1; }
            19%  { opacity: 0; }
            100% { opacity: 0; }
        }

        @keyframes sway {
            0%, 100% { transform: rotate(-3deg); }
            50%      { transform: rotate(3deg); }
        }

        /* === ВИДЕО-ПЛЕЙЛИСТ === */
        .video-player {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto 30px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background: #1a1525;
        }

        .video-player video {
            width: 100%;
            height: auto;
            display: block;
        }

        .sound-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(5px);
            z-index: 10;
            font-family: inherit;
        }

        .sound-btn:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: scale(1.05);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #c9b8e8, #9d8ec4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            font-size: 1.1rem;
            color: #b8aed0;
            margin-bottom: 40px;
            line-height: 1.6;
            font-style: italic;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 30px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            color: #e8e4f0;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .link-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(201, 184, 232, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .link-btn .icon {
            font-size: 1.3rem;
        }

        .footer {
            font-size: 0.85rem;
            color: #8a7fa8;
            margin-top: 30px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.9rem; }
            .pony-animation { width: 140px; height: 140px; }
            .container { padding: 35px 20px; }
            .tagline { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- Анимированная пони -->
        <div class="pony-animation">
            <img src="pony1.png" alt="Печальная пони">
            <img src="pony2.png" alt="Печальная пони">
            <img src="pony3.png" alt="Печальная пони">
            <img src="pony4.png" alt="Печальная пони">
            <img src="pony5.png" alt="Печальная пони">
            <img src="pony6.png" alt="Печальная пони">
        </div>

        <h1>Печальная пони</h1>
        <p class="tagline">Грустить вместе — не так одиноко.<br>Уютное сообщество для тех, кто устал.</p>

        <!-- ВИДЕО-ПЛЕЙЛИСТ (13 видео) -->
        <div class="video-player">
            <video id="playlist" playsinline autoplay muted>
                <source src="video1.mp4" type="video/mp4">
                <source src="video2.mp4" type="video/mp4">
                <source src="video3.mp4" type="video/mp4">
                <source src="video4.mp4" type="video/mp4">
                <source src="video5.mp4" type="video/mp4">
                <source src="video6.mp4" type="video/mp4">
                <source src="video7.mp4" type="video/mp4">
                <source src="video8.mp4" type="video/mp4">
                <source src="video9.mp4" type="video/mp4">
                <source src="video10.mp4" type="video/mp4">
                <source src="video11.mp4" type="video/mp4">
                <source src="video12.mp4" type="video/mp4">
                <source src="video13.mp4" type="video/mp4">
            </video>
            <button class="sound-btn" onclick="toggleSound()" id="soundBtn">🔇 Включить звук</button>
        </div>

        <div class="links">
            <a href="https://t.me/ВАШ_КАНАЛ" class="link-btn" target="_blank" rel="noopener">
                <span class="icon">✈️</span>
                <span>Telegram</span>
            </a>
            <a href="https://discord.gg/ВАШ_СЕРВЕР" class="link-btn" target="_blank" rel="noopener">
                <span class="icon">💬</span>
                <span>Discord</span>
            </a>
            <a href="https://tiktok.com/@ВАШ_АККАУНТ" class="link-btn" target="_blank" rel="noopener">
                <span class="icon">🎵</span>
                <span>TikTok</span>
            </a>
        </div>

        <p class="footer">
            © 2026 Сообщество «Печальная пони»<br>
            Сделано с грустью и любовью
        </p>
    </div>

    <script>
        // === ВИДЕО-ПЛЕЙЛИСТ ===
        const video = document.getElementById('playlist');
        const sources = video.querySelectorAll('source');
        let currentVideo = 0;

        // Загружаем видео по индексу
        function loadVideo(index) {
            video.src = sources[index].src;
            video.load();
            video.play().catch(e => console.log('Автовоспроизведение заблокировано:', e));
        }

        // Когда видео закончилось — переключаем на следующее
        video.addEventListener('ended', () => {
            currentVideo = (currentVideo + 1) % sources.length;
            loadVideo(currentVideo);
        });

        // Инициализация
        loadVideo(0);

        // === ЗВУК ===
        let soundOn = false;
        const soundBtn = document.getElementById('soundBtn');

        function toggleSound() {
            soundOn = !soundOn;
            video.muted = !soundOn;
            soundBtn.textContent = soundOn ? '🔊 Выключить звук' : '🔇 Включить звук';
            if (soundOn) {
                video.play().catch(e => console.log(e));
            }
        }
    </script>
</body>
</html>
